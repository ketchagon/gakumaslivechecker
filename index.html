<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>
        学マスライブ回収率チェッカー
    </title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    
    <!-- OGP設定 -->
    <meta property="og:title" content="学マスライブ回収率チェッカー">
    <meta property="og:description" content="学マスのライブ参加状況や楽曲の回収率をチェックしよう！">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://ketchagon.github.io/gakumaslivechecker/">
    <meta property="og:image" content="https://ketchagon.github.io/gakumaslivechecker/image/ogp.jpg">
    <meta property="og:site_name" content="学マスライブ回収率チェッカー">
    
    <!-- X（Twitter）設定 -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="学マスライブ回収率チェッカー">
    <meta name="twitter:description" content="学マスのライブ参加状況や楽曲の回収率をチェックしよう！">
    <meta name="twitter:image" content="https://ketchagon.github.io/gakumaslivechecker/image/ogp.jpg">
    <meta name="twitter:image:alt" content="学マスライブ回収率チェッカー">

</head>
<body>
    <header>
        <h1>学マスライブ回収率チェッカー</h1>
        <ul>
            <li>このページでは学マスのライブの参加率や曲の回収状況、未回収曲の絞り込みができます</li>
            <li>公式とは全く関係ありません</li>
            <li>一部イベントや楽曲については入れたり入れてなかったりしています</li>
            <li>バージョンは言い出したらキリがないのでまとめてます</li>
            <li>ご意見、不具合、文句、お気持ちなどは製作者まで</li>
        </ul>
        <p>製作者:<a href = "https://x.com/ketchagon" target="_blank" rel="noopener noreferrer">@ketchagon</a></p>
    </header>
    <main>
        <section class="summary">
            <h2>楽曲回収状況</h2>
            <section class="container">
                <div class="info-card">
                    <p class="summary-num" id="total">0</p>
                    <p>全楽曲</p>
                </div>
                <div class="info-card">
                    <p class="summary-num" id="collected">0</p>
                    <p>回収済み</p>
                </div>
                <div class="info-card">
                    <p class="summary-num" id="uncollected">0</p>
                    <p>未回収</p>
                </div>
                <div class="info-card">
                    <p class="summary-num" id="progress-text">0%</p>
                    <p>回収率</p>
                </div>
            </section>
            <section class="live-summary">
                <h2>ライブ参加状況</h2>
                <div class="live-summary-container">
                    <div class="live-summary-card">
                        <p class="summary-num" id="total-live-count">0</p>
                        <p>全ライブ</p>
                    </div>

                    <div class="live-summary-card">
                        <p class="summary-num" id="participated-live-count">0</p>
                        <p>参加</p>
                    </div>

                    <div class="live-summary-card">
                        <p class="summary-num" id="unparticipated-live-count">0</p>
                        <p>未参加</p>
                    </div>
                </div>
            </section>
            <button id="share-x-button" class="share-x-button">𝕏  回収率をXに投稿する</button>
            <section class="live-section">
                <h2>ライブ一覧</h2>
                <div id="live-list" class="live-list">
                    <p>読み込み中</p>
                </div>
            </section>
            <section class="song-section">
                <h2>未回収楽曲</h2>
                <div id="uncollected-list">
                    <p>読み込み中</p>
                </div>
            </section>
        </section>
    </main>
</body>
